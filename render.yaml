services:
  - type: web
    name: aura-demo
    runtime: python
    buildCommand: |
      pip install -r requirements.txt && \
      python build_frontend.py && \
      (cd frontend && npm install && npm run build) && \
      mkdir -p dist && \
      cp -r frontend/dist/* dist/
    startCommand: uvicorn aura_bootstrap:app --host 0.0.0.0 --port $PORT
